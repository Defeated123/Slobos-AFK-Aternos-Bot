services:
  bot:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    command: sh -c "npm install --omit=dev && node --watch index.js"
    restart: unless-stopped
